services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .docker.env
    depends_on: 
           - database

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: insta
      POSTGRES_PORT: 5431
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: '12345'
      POSTGRES_USER: postgres
    volumes:
         - insta-postgres-data:/var/lib/postgresql/data  
   
volumes: 
  insta-postgres-data:
